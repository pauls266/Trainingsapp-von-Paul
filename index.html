<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Laufbuch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Laufbuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#16222E; --muted:#5E6A77; --line:#D5DBE2;
  --accent:#2346D6; --accent-ink:#FFFFFF; --bib:#F5C518; --bib-ink:#1B1A12; --warn:#B4531B;
  --z1:#98A6B5; --z2:#3A8BD6; --z3:#23A273; --z4:#EE9A1F; --z5:#DE4637;
  --hr:#DE4637; --pace:#2346D6;
  --body:"Barlow", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --cond:"Barlow Condensed", "Arial Narrow", "Roboto Condensed", -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A24; --surface:#1A2431; --ink:#E7ECF1; --muted:#9AA7B4; --line:#2B3847;
    --accent:#7A95FF; --accent-ink:#0E1522; --warn:#F0955A; --pace:#7A95FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121A24; --surface:#1A2431; --ink:#E7ECF1; --muted:#9AA7B4; --line:#2B3847;
  --accent:#7A95FF; --accent-ink:#0E1522; --warn:#F0955A; --pace:#7A95FF; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.wrap{max-width:560px; margin:0 auto; padding:0 16px 110px}

header.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); display:flex; align-items:center; gap:8px; padding:12px 16px 10px; max-width:560px; margin:0 auto}
header.top h1{font-family:var(--cond); font-weight:700; font-size:26px; letter-spacing:.2px; margin:0; flex:1}
.btn{border:0; border-radius:10px; padding:9px 14px; background:var(--accent); color:var(--accent-ink); font-weight:600; font-size:15px}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line)}
.btn.danger{background:transparent; color:var(--hr); border:1px solid var(--line)}
.icon-btn{width:40px; height:40px; border-radius:10px; border:1px solid var(--line); background:transparent; display:grid; place-items:center}
.icon-btn svg{width:20px; height:20px}

nav.tabs{position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none; border:0; padding:8px 0 9px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:12px; font-weight:500; color:var(--muted)}
nav.tabs button svg{width:22px; height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

h2{font-family:var(--cond); font-weight:600; font-size:22px; margin:26px 0 8px; letter-spacing:.2px}
h3{font-size:15px; font-weight:600; margin:16px 0 6px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.panel{background:var(--surface); border-radius:14px; padding:14px 16px}
.panel + .panel{margin-top:10px}

/* Startnummer – das Herzstück */
.bib{position:relative; background:var(--bib); color:var(--bib-ink); border-radius:12px; padding:22px 24px 20px; margin-top:6px; overflow:hidden}
.bib .pin{position:absolute; width:9px; height:9px; border-radius:50%; background:var(--bg); box-shadow:inset 0 1px 1px rgba(0,0,0,.25)}
.bib .pin:nth-child(1){top:10px; left:10px}.bib .pin:nth-child(2){top:10px; right:10px}.bib .pin:nth-child(3){bottom:10px; left:10px}.bib .pin:nth-child(4){bottom:10px; right:10px}
.bib .date{font-size:14px; font-weight:500; opacity:.78}
.bib .row{display:flex; align-items:flex-end; gap:14px; margin:4px 0 6px}
.bib .kmnum{font-family:var(--cond); font-weight:700; font-size:88px; line-height:.86; letter-spacing:-1px}
.bib .kmnum small{font-size:24px; font-weight:600; letter-spacing:0; margin-left:3px}
.bib .title{font-family:var(--cond); font-weight:600; font-size:26px; line-height:1.05; padding-bottom:6px}
.bib .tempo{font-weight:600; font-size:15px; border-top:2px solid var(--bib-ink); padding-top:8px; margin-top:8px}
.bib .detail{font-size:15px; margin-top:4px}

.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border-radius:14px; overflow:hidden}
.stats > div{background:var(--surface); padding:12px 12px 11px}
.stats .v{font-family:var(--cond); font-weight:600; font-size:28px; line-height:1.05}
.stats .l{font-size:13px; color:var(--muted)}
.state{display:inline-block; font-weight:600; font-size:14px; padding:3px 9px; border-radius:6px; background:var(--bg)}

.list{background:var(--surface); border-radius:14px; overflow:hidden}
.item{display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); width:100%; background:none; border-left:0; border-right:0; border-top:0; text-align:left}
.item:last-child{border-bottom:0}
.item .main{flex:1; min-width:0}
.item .t1{font-weight:600}
.item .t2{font-size:13.5px; color:var(--muted)}
.item .big{font-family:var(--cond); font-weight:600; font-size:24px; white-space:nowrap}
.zbar{display:flex; height:5px; border-radius:3px; overflow:hidden; margin-top:6px; background:var(--line)}
.zbar i{display:block; height:100%}
.month{font-size:14px; font-weight:600; color:var(--muted); margin:20px 4px 6px}

.week .item{align-items:flex-start}
.week .wd{font-family:var(--cond); font-weight:700; font-size:20px; width:30px; padding-top:1px}
.week .today{background:color-mix(in srgb, var(--bib) 22%, var(--surface))}
.tag{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:6px; vertical-align:1px}

.ztable .item{padding:10px 16px}
.zchip{width:34px; height:26px; border-radius:6px; display:grid; place-items:center; font-family:var(--cond); font-weight:700; color:#fff; font-size:16px; flex:none}

.notes{margin:0; padding:0; list-style:none}
.notes li{background:var(--surface); border-radius:12px; padding:12px 14px 12px 16px; border-left:4px solid var(--accent); margin-bottom:8px; font-size:15px}

.chart{display:block; width:100%}
.axis{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:3px}
.legend{display:flex; gap:14px; font-size:13px; color:var(--muted); margin-bottom:6px; flex-wrap:wrap}
.legend b{display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:4px; margin-right:5px}

.empty{padding:34px 4px 10px}
.empty h2{font-size:34px; line-height:1.05; margin-top:10px}
.steps{padding-left:22px; margin:8px 0 18px}
.steps li{margin-bottom:8px}

.sheet{position:fixed; inset:0; z-index:20; background:var(--bg); overflow-y:auto; -webkit-overflow-scrolling:touch; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); display:none}
.sheet.open{display:block; animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px); opacity:.4} to{transform:none; opacity:1}}
@media (prefers-reduced-motion: reduce){ .sheet.open{animation:none} }
.sheet .bar{position:sticky; top:0; background:var(--bg); display:flex; align-items:center; gap:10px; padding:12px 16px; max-width:560px; margin:0 auto; z-index:2}
.sheet .bar h2{margin:0; flex:1; font-size:24px}

.form label{display:block; font-size:14px; font-weight:500; margin:14px 0 5px}
.form .hint{font-size:13px; color:var(--muted); margin-top:4px}
.form input,.form select{width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font-size:16px}
.form .two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.seg{display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden}
.seg button{flex:1; border:0; background:var(--surface); padding:10px 4px; font-size:15px}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); font-weight:600}

.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:14.5px; z-index:30; max-width:90vw; display:none}
.toast.show{display:block}
.privacy{font-size:13.5px; color:var(--muted); display:flex; gap:8px; align-items:flex-start; margin-top:18px}
.privacy svg{flex:none; width:16px; height:16px; margin-top:2px}
.scroll-x{overflow-x:auto}
.rec{display:flex; gap:16px; align-items:center}
.rec .score{font-family:var(--cond); font-weight:700; font-size:60px; line-height:.9; min-width:74px}
.rec .score small{display:block; font-family:var(--body); font-size:12.5px; font-weight:500; color:var(--muted); line-height:1.2; margin-top:4px}
.factor{display:flex; gap:10px; padding:9px 0; border-top:1px solid var(--line); font-size:14.5px}
.factor:first-of-type{margin-top:12px}
.factor .dot{flex:none; width:8px; height:8px; border-radius:50%; margin-top:7px}
.factor .fv{margin-left:auto; font-family:var(--cond); font-weight:600; font-size:19px; white-space:nowrap; padding-left:8px}
textarea{width:100%; min-height:110px; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font:inherit; font-size:15px; color:var(--ink)}
.code{font-family:ui-monospace, Menlo, Consolas, monospace; font-size:13.5px; background:var(--bg); border:1px solid var(--line); padding:1px 5px; border-radius:5px; word-break:break-all}
.guide{background:var(--surface); border-radius:14px; padding:4px 16px 12px}
.guide ol{padding-left:20px; margin:8px 0}
.guide li{margin-bottom:9px; font-size:15px}
</style>
</head>
<body>
<header class="top">
  <h1>Laufbuch</h1>
  <button class="btn" id="importBtn">Importieren</button>
  <button class="icon-btn" id="settingsBtn" aria-label="Einstellungen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
  <input type="file" id="fileIn" multiple hidden>
</header>

<main class="wrap" id="view"></main>

<nav class="tabs"><div class="in" id="tabs">
  <button data-tab="heute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="7.5" cy="6.5" r=".8"/><circle cx="16.5" cy="6.5" r=".8"/><path d="M8 13h8M8 16.5h5"/></svg>Heute</button>
  <button data-tab="laeufe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Läufe</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</button>
  <button data-tab="zonen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V14M9 20V10M14 20V7M19 20V4"/></svg>Zonen</button>
  <button data-tab="trends"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>Trends</button>
</div></nav>

<section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
<div class="toast" id="toast" role="status"></div>

<script>
/* ================= Analyse-Kern (läuft komplett lokal) ================= */
const FIT_EPOCH_OFFSET = 631065600;
const BT = {0:[1,'u8',0xFF],1:[1,'s8',0x7F],2:[1,'u8',0xFF],3:[2,'s16',0x7FFF],4:[2,'u16',0xFFFF],5:[4,'s32',0x7FFFFFFF],6:[4,'u32',0xFFFFFFFF],7:[1,'str',null],8:[4,'f32',null],9:[8,'f64',null],10:[1,'u8',0],11:[2,'u16',0],12:[4,'u32',0],13:[1,'u8',0xFF],14:[8,'x',null],15:[8,'x',null],16:[8,'x',null]};
const GMSG = {0:'file_id',3:'user_profile',7:'zones_target',18:'session',19:'lap',20:'record'};
const DAY = 864e5;

function parseFit(buffer){
  const dv = new DataView(buffer);
  if (buffer.byteLength < 14) throw new Error('Datei zu klein');
  const hs = dv.getUint8(0);
  const sig = String.fromCharCode(dv.getUint8(8),dv.getUint8(9),dv.getUint8(10),dv.getUint8(11));
  if (sig !== '.FIT') throw new Error('Keine FIT-Datei');
  const end = Math.min(hs + dv.getUint32(4,true), buffer.byteLength);
  const out = {file_id:[],user_profile:[],zones_target:[],session:[],lap:[],record:[]};
  const defs = {};
  let p = hs, lastTs = 0;
  const readVal = (t,le) => {
    switch(t){
      case 'u8': return dv.getUint8(p); case 's8': return dv.getInt8(p);
      case 'u16': return dv.getUint16(p,le); case 's16': return dv.getInt16(p,le);
      case 'u32': return dv.getUint32(p,le); case 's32': return dv.getInt32(p,le);
      case 'f32': return dv.getFloat32(p,le); case 'f64': return dv.getFloat64(p,le);
    } return null;
  };
  const readData = def => {
    const m = {};
    for (const f of def.fields){
      const b = BT[f.bt & 0x1F];
      if (b && f.size === b[0] && b[1] !== 'str' && b[1] !== 'x'){
        const v = readVal(b[1], def.le);
        if (!(b[2] !== null && v === b[2]) && !Number.isNaN(v)) m[f.num] = v;
      }
      p += f.size;
    }
    p += def.devSize;
    return m;
  };
  const store = (def,m) => { const n = GMSG[def.gnum]; if (n) out[n].push(m); };
  try {
    while (p < end){
      const h = dv.getUint8(p++);
      if (h & 0x80){
        const def = defs[(h >> 5) & 3]; if (!def) throw new Error('Defekte FIT-Datei');
        const off = h & 0x1F, low = lastTs % 32;
        let ts = lastTs - low + off; if (off < low) ts += 32;
        lastTs = ts;
        const m = readData(def); m[253] = ts; store(def,m);
      } else if (h & 0x40){
        const lt = h & 0x0F, hasDev = (h & 0x20) !== 0;
        p++;
        const le = dv.getUint8(p++) === 0;
        const gnum = dv.getUint16(p, le); p += 2;
        const nf = dv.getUint8(p++), fields = [];
        for (let i=0;i<nf;i++){ fields.push({num:dv.getUint8(p), size:dv.getUint8(p+1), bt:dv.getUint8(p+2)}); p += 3; }
        let devSize = 0;
        if (hasDev){ const nd = dv.getUint8(p++); for (let i=0;i<nd;i++){ devSize += dv.getUint8(p+1); p += 3; } }
        defs[lt] = {gnum, le, fields, devSize};
      } else {
        const def = defs[h & 0x0F]; if (!def) throw new Error('Defekte FIT-Datei');
        const m = readData(def);
        if (m[253] != null) lastTs = m[253];
        store(def,m);
      }
    }
  } catch(e){
    if (!(e instanceof RangeError) || !out.record.length) throw e; // abgeschnittene Datei: vorhandene Daten nutzen
  }
  return out;
}

const SPORTS = {0:'Sonstiges',1:'Laufen',2:'Radfahren',4:'Fitnessgerät',5:'Schwimmen',10:'Krafttraining',11:'Gehen',15:'Rudern',17:'Wandern',19:'Paddeln',21:'E-Bike',25:'Yoga'};
const SUBSPORTS_RUN = {1:'Laufband',2:'Straße',3:'Trail',4:'Bahn',45:'Virtuell',58:'Ultra'};

function bestByDistance(T, D, target){
  let best = Infinity, i = 0; const n = T.length;
  for (let j=0;j<n;j++){
    while (i < j-1 && D[j]-D[i+1] >= target) i++;
    const dd = D[j]-D[i];
    if (dd >= target){ const dt = (T[j]-T[i]) * target/dd; if (dt < best && target/dt < 6.7) best = dt; }
  }
  return best === Infinity ? null : Math.round(best);
}
function bestByTime(T, D, dur){
  let best = 0, i = 0; const n = T.length;
  for (let j=0;j<n;j++){
    while (i < j-1 && T[j]-T[i+1] >= dur) i++;
    const dt = T[j]-T[i];
    if (dt >= dur){ const d = (D[j]-D[i]) * dur/dt; if (d > best && d/dur < 6.7) best = d; }
  }
  return best > 0 ? Math.round(best) : null;
}

function buildActivity(fit){
  const recs = fit.record.filter(r => r[253] != null).sort((a,b)=>a[253]-b[253]);
  const s = fit.session[0] || {};
  if (!fit.session.length && recs.length < 10) return null;
  const startFit = s[2] != null ? s[2] : (recs[0] && recs[0][253]);
  if (startFit == null) return null;
  const sport = s[5] != null ? s[5] : 0, subSport = s[6] != null ? s[6] : 0, isRun = sport === 1;
  const n = recs.length;
  const T = new Float64Array(n), HR = new Float64Array(n), D = new Float64Array(n), V = new Float64Array(n), C = new Float64Array(n), A = new Float64Array(n);
  let gSum=0,gN=0,oSum=0,oN=0,lastD=0;
  for (let i=0;i<n;i++){
    const r = recs[i];
    T[i] = r[253]-startFit; HR[i] = r[3] || 0;
    D[i] = r[5] != null ? r[5]/100 : lastD; if (D[i] < lastD) D[i] = lastD; lastD = D[i];
    V[i] = r[73] != null ? r[73]/1000 : (r[6] != null ? r[6]/1000 : NaN);
    C[i] = r[4] != null ? (r[4] + (r[53]||0)/128) * (isRun?2:1) : 0;
    A[i] = r[78] != null ? r[78]/5-500 : (r[2] != null ? r[2]/5-500 : NaN);
    if (r[41] != null){ gSum += r[41]/10; gN++; }
    if (r[39] != null){ oSum += r[39]/10; oN++; }
  }
  for (let i=1;i<n;i++){ if (Number.isNaN(V[i])){ const dt = T[i]-T[i-1]; V[i] = dt > 0 ? (D[i]-D[i-1])/dt : 0; } }
  if (n && Number.isNaN(V[0])) V[0] = 0;

  // 5-Sekunden-Stream für Diagramme & zonenabhängige Werte
  const B = 5, bins = new Map();
  for (let i=0;i<n;i++){
    const k = Math.floor(T[i]/B);
    let b = bins.get(k);
    if (!b){ b = {h:0,hn:0,v:0,vn:0,c:0,cn:0,a:0,an:0,d:D[i]}; bins.set(k,b); }
    if (HR[i] > 0){ b.h += HR[i]; b.hn++; }
    if (V[i] >= 0 && V[i] < 12){ b.v += V[i]; b.vn++; }
    if (C[i] > 0){ b.c += C[i]; b.cn++; }
    if (!Number.isNaN(A[i])){ b.a += A[i]; b.an++; }
    b.d = D[i];
  }
  const keys = [...bins.keys()].sort((a,b)=>a-b);
  const st = {t:[],hr:[],v:[],c:[],d:[],a:[]};
  for (const k of keys){
    const b = bins.get(k);
    st.t.push(k*B); st.hr.push(b.hn ? Math.round(b.h/b.hn) : 0);
    st.v.push(b.vn ? Math.round(b.v/b.vn*100)/100 : 0);
    st.c.push(b.cn ? Math.round(b.c/b.cn) : 0); st.d.push(Math.round(b.d));
    st.a.push(b.an ? Math.round(b.a/b.an*10)/10 : null);
  }

  const timer = s[8] != null ? s[8]/1000 : (n ? T[n-1] : 0);
  const dist = s[9] != null ? s[9]/100 : (n ? D[n-1] : 0);
  const hrs = st.hr.filter(x=>x>0);
  const avgHR = s[16] != null ? s[16] : (hrs.length ? Math.round(hrs.reduce((a,b)=>a+b,0)/hrs.length) : null);
  const maxHR = s[17] != null ? s[17] : (hrs.length ? Math.max(...hrs) : null);
  const avgSpd = s[124] != null ? s[124]/1000 : (s[14] != null ? s[14]/1000 : (timer > 0 ? dist/timer : 0));
  const cads = st.c.filter((c,i)=>c>0 && st.v[i]>1.5);

  // beste 30-min-Herzfrequenz (für Laktatschwellen-Schätzung)
  let hr30 = null;
  { let i=0, sum=0, cnt=0;
    for (let j=0;j<st.t.length;j++){
      if (st.hr[j] > 0){ sum += st.hr[j]; cnt++; }
      while (i < j && st.t[j]-st.t[i] > 1800){ if (st.hr[i] > 0){ sum -= st.hr[i]; cnt--; } i++; }
      if (st.t[j]-st.t[i] >= 1780 && cnt >= 300){ const a = sum/cnt; if (hr30 === null || a > hr30) hr30 = Math.round(a); }
    } }

  const bestD = {}, bestT = {};
  if (isRun && dist > 900){
    for (const d of [1000,5000,10000,21097.5,42195]) if (dist >= d){ const v = bestByDistance(T,D,d); if (v) bestD[d] = v; }
    for (const t of [180,300,720,1200,1800,3600]) if (timer >= t){ const v = bestByTime(T,D,t); if (v) bestT[t] = v; }
  }
  const zt = fit.zones_target[0] || {}, up = fit.user_profile[0] || {};
  const start = (startFit + FIT_EPOCH_OFFSET)*1000;
  return {
    id: String(start), start, sport, subSport, isRun,
    name: isRun ? (SUBSPORTS_RUN[subSport] ? 'Lauf ('+SUBSPORTS_RUN[subSport]+')' : 'Lauf') : (SPORTS[sport] || 'Aktivität'),
    dist, timer, avgHR, maxHR, avgSpd,
    ascent: s[22] != null ? s[22] : null, kcal: s[11] != null ? s[11] : null,
    te: s[24] != null ? s[24]/10 : null, ane: s[137] != null ? s[137]/10 : null,
    cad: cads.length ? Math.round(cads.reduce((a,b)=>a+b,0)/cads.length) : null,
    gct: gN ? Math.round(gSum/gN) : null, vo: oN ? Math.round(oSum/oN*10)/100 : null,
    hr30, bestD, bestT,
    watch: { lthr: zt[2] != null ? zt[2] : null, maxHR: zt[1] != null ? zt[1] : null, rest: up[8] != null ? up[8] : null, sex: up[1] === 0 ? 'f' : (up[1] === 1 ? 'm' : null) },
    stream: st
  };
}

/* ---------------- Parameter & Zonen ---------------- */
function estimateParams(acts, S){
  const now = Date.now();
  const recent = acts.filter(a => now - a.start < 365*DAY).sort((a,b)=>b.start-a.start);
  const src = {};
  let maxHR = +S.maxHR || null;
  if (maxHR) src.maxHR = 'eigene Eingabe';
  else {
    const obs = Math.max(0, ...recent.map(a => (a.maxHR && a.maxHR < 225) ? a.maxHR : 0));
    if (obs >= 150){ maxHR = obs; src.maxHR = 'höchster Wert der letzten 12 Monate'; }
    else if (+S.age){ maxHR = Math.round(208 - 0.7*S.age); src.maxHR = 'Formel 208 − 0,7 × Alter'; }
    else { maxHR = 190; src.maxHR = 'Standardwert – bitte eintragen'; }
  }
  let restHR = +S.restHR || null;
  if (restHR) src.restHR = 'eigene Eingabe';
  else { const w = recent.find(a => a.watch && a.watch.rest >= 30 && a.watch.rest <= 100);
    if (w){ restHR = w.watch.rest; src.restHR = 'Uhr-Profil'; } else { restHR = 55; src.restHR = 'Standardwert – bitte eintragen'; } }
  let lthr = +S.lthr || null;
  if (lthr) src.lthr = 'eigene Eingabe';
  else {
    const w = recent.find(a => a.watch && a.watch.lthr >= 110 && a.watch.lthr <= maxHR - 3);
    if (w){ lthr = w.watch.lthr; src.lthr = 'Einstellung aus der Uhr'; }
    else {
      const h = Math.max(0, ...recent.filter(a => a.isRun && now - a.start < 180*DAY).map(a => a.hr30 || 0));
      if (h >= 0.85*maxHR && h < maxHR){ lthr = h; src.lthr = 'beste 30-Minuten-Belastung (Schätzung)'; }
      else { lthr = Math.round(0.9*maxHR); src.lthr = 'grobe Schätzung (90 % der HFmax)'; }
    }
  }
  let sex = S.sex || (recent.find(a => a.watch && a.watch.sex) || {watch:{}}).watch.sex || 'm';
  return {maxHR, restHR, lthr, sex, src};
}
function hrBounds(lthr){ return [0.85,0.90,0.95,1.0].map(f => Math.round(f*lthr)); } // Untergrenzen Z2..Z5
function zoneOf(hr, b){ let z = 0; while (z < 4 && hr >= b[z]) z++; return z; }

function derive(act, P){
  const st = act.stream, b = hrBounds(P.lthr), zs = [0,0,0,0,0];
  const k = P.sex === 'f' ? [0.86,1.67] : [0.64,1.92];
  let trimp = 0, hrN = 0;
  for (let i=0;i<st.hr.length;i++){
    const hr = st.hr[i]; if (!(hr > 0)) continue;
    hrN++; zs[zoneOf(hr,b)] += 5;
    const x = Math.min(1, Math.max(0, (hr-P.restHR)/(P.maxHR-P.restHR)));
    trimp += (5/60) * x * k[0] * Math.exp(k[1]*x);
  }
  let hrEst = false;
  if (hrN < 30){ trimp = act.timer/60; hrEst = true; }
  let dec = null, ef = null;
  const tot = zs.reduce((a,c)=>a+c,0);
  if (act.isRun && act.timer >= 2400 && tot > 0 && (zs[3]+zs[4]) < 0.15*tot){
    const idx = []; for (let i=0;i<st.t.length;i++) if (st.v[i] > 1.5 && st.hr[i] > 0) idx.push(i);
    const use = idx.slice(Math.floor(idx.length*0.1));
    if (use.length >= 200){
      const vs = use.map(i=>st.v[i]), m = vs.reduce((a,c)=>a+c,0)/vs.length;
      const sd = Math.sqrt(vs.reduce((a,c)=>a+(c-m)**2,0)/vs.length);
      if (sd/m < 0.15){
        const half = Math.floor(use.length/2);
        const efOf = arr => { let v=0,h=0; for (const i of arr){ v += st.v[i]; h += st.hr[i]; } return v/h; };
        const e1 = efOf(use.slice(0,half)), e2 = efOf(use.slice(half));
        dec = Math.round((e1-e2)/e1*1000)/10;
      }
    }
  }
  if (act.isRun && act.avgHR && act.avgHR < b[1] && act.timer >= 1200 && act.avgSpd > 1.5) ef = Math.round(act.avgSpd*60/act.avgHR*100)/100;
  return {zs, trimp: Math.round(trimp*10)/10, hrEst, dec, ef};
}

/* ---------------- VDOT & Tempobereiche (nach Jack Daniels, angenähert) ---------------- */
function vdotFrom(distM, sec){
  const t = sec/60, v = distM/t;
  const vo2 = -4.60 + 0.182258*v + 0.000104*v*v;
  const pct = 0.8 + 0.1894393*Math.exp(-0.012778*t) + 0.2989558*Math.exp(-0.1932605*t);
  return vo2/pct;
}
function velAtVO2(vo2){ const a = 0.000104, b = 0.182258, c = -4.60 - vo2; return (-b + Math.sqrt(b*b - 4*a*c))/(2*a); }
function predictTime(distM, vdot){
  let lo = distM/10, hi = distM/0.5;
  for (let i=0;i<80;i++){ const mid = (lo+hi)/2; if (vdotFrom(distM, mid) > vdot) lo = mid; else hi = mid; }
  return (lo+hi)/2;
}
function estimateVdot(acts, S){
  const rd = +S.raceDist, rt = parseDuration(S.raceTime);
  if (rd > 0 && rt > 0) return {vdot: vdotFrom(rd*1000, rt), src: 'Wettkampfergebnis (eigene Eingabe)'};
  const now = Date.now(); let best = null;
  for (const a of acts){
    if (!a.isRun || now - a.start > 120*DAY) continue;
    for (const d in a.bestD) if (+d >= 3000){ const v = vdotFrom(+d, a.bestD[d]); if (!best || v > best.vdot) best = {vdot:v, a, what: fmtDistLabel(+d)}; }
    for (const t in a.bestT) if (+t >= 720){ const v = vdotFrom(a.bestT[t], +t); if (!best || v > best.vdot) best = {vdot:v, a, what: (+t/60)+' min'}; }
  }
  if (best && best.vdot >= 20 && best.vdot <= 85) return {vdot: best.vdot, src: 'beste '+best.what+' der letzten 120 Tage ('+fmtDate(best.a.start)+')', fromTraining: true};
  return null;
}
function trainingPaces(vdot){
  const pace = v => 60000/v; // Sekunden pro km aus m/min
  return {
    E: [pace(velAtVO2(0.62*vdot)), pace(velAtVO2(0.70*vdot))],
    M: predictTime(42195, vdot)/42.195,
    HM: predictTime(21097.5, vdot)/21.0975,
    T: pace(velAtVO2(0.88*vdot)),
    I: pace(velAtVO2(0.975*vdot))
  };
}

/* ---------------- Belastung (TRIMP → Fitness/Ermüdung/Form) ---------------- */
function dayKey(ts){ const d = new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function mondayOf(ts){ const d = new Date(ts); d.setHours(0,0,0,0); d.setDate(d.getDate() - (d.getDay()+6)%7); return d.getTime(); }
function loadSeries(acts, der, today = Date.now()){
  if (!acts.length) return [];
  const loads = {};
  for (const a of acts){ const k = dayKey(a.start); loads[k] = (loads[k]||0) + (der[a.id] ? der[a.id].trimp : 0); }
  const first = Math.min(...acts.map(a=>a.start));
  const d = new Date(first); d.setHours(12,0,0,0);
  const endK = dayKey(today), out = [];
  let ctl = 0, atl = 0;
  for (let guard=0; guard<4000; guard++){
    const k = dayKey(d.getTime()), L = loads[k] || 0, tsb = ctl - atl;
    ctl += (L - ctl)/42; atl += (L - atl)/7;
    out.push({date:k, ts:d.getTime(), load:L, ctl, atl, tsb});
    if (k === endK) break;
    d.setDate(d.getDate()+1);
  }
  return out;
}
function weeklyKm(acts, weeks = 12, today = Date.now()){
  const m0 = mondayOf(today), res = [];
  for (let w=weeks-1; w>=0; w--){
    const ws = new Date(m0); ws.setDate(ws.getDate() - 7*w);
    const we = new Date(ws); we.setDate(we.getDate()+7);
    const km = acts.filter(a => a.isRun && a.start >= ws.getTime() && a.start < we.getTime()).reduce((s,a)=>s+a.dist/1000,0);
    res.push({start: ws.getTime(), km});
  }
  return res;
}

/* ---------------- Trainingsplan (regelbasiert) ---------------- */
const WD = ['Mo','Di','Mi','Do','Fr','Sa','So'];
function buildPlan(ctx){
  const {S, acts, der, P, paces, series, today = Date.now()} = ctx;
  const goal = S.goal === 'hm' ? 'hm' : 'm';
  const nRuns = Math.min(6, Math.max(3, +S.runsPerWeek || 4));
  const wk = weeklyKm(acts, 9, today);
  const done = wk.slice(0, 8);            // abgeschlossene Wochen
  const last4 = done.slice(-4), vol4 = last4.reduce((s,w)=>s+w.km,0)/4;
  const peak8 = Math.max(0, ...done.map(w=>w.km));
  const longest6 = Math.max(0, ...acts.filter(a => a.isRun && today - a.start < 42*DAY).map(a => a.dist/1000));
  const notes = [];

  // Phase
  let wtr = null, phase, raceTs = null;
  if (S.raceDate){ raceTs = new Date(S.raceDate+'T12:00').getTime(); wtr = Math.round((mondayOf(raceTs) - mondayOf(today))/(7*DAY)); const t0 = new Date(today); t0.setHours(0,0,0,0); if (wtr < 0 || raceTs < t0.getTime()){ wtr = null; raceTs = null; } }
  const tp = goal === 'm' ? {taper:2, spec:8, build:14} : {taper:1, spec:6, build:11};
  if (wtr === null) phase = 'Grundlage';
  else if (wtr <= tp.taper) phase = 'Tapering';
  else if (wtr <= tp.spec) phase = 'Spezifisch';
  else if (wtr <= tp.build) phase = 'Aufbau';
  else phase = 'Grundlage';

  // Form
  const cur = series.length ? series[series.length-1] : {ctl:0, atl:0, tsb:0};
  const rel = cur.ctl > 5 ? cur.tsb/cur.ctl : 0, acwr = cur.ctl > 5 ? cur.atl/cur.ctl : 1;
  const fatigued = rel < -0.3 || acwr > 1.5;
  const isoWeek = Math.floor((mondayOf(today) - new Date(2024,0,1).getTime())/(7*DAY));
  const recovery = phase !== 'Tapering' && !fatigued && (wtr !== null ? (wtr - tp.taper) % 4 === 0 && wtr - tp.taper > 0 : isoWeek % 4 === 3);

  // Umfang
  let V;
  if (vol4 < 5){ V = goal === 'm' ? 25 : 20; notes.push('Noch wenig Laufdaten der letzten 4 Wochen – der Plan startet mit einem vorsichtigen Einstiegsumfang. Importiere mehr Läufe für genauere Vorschläge.'); }
  else if (phase === 'Tapering'){ const f = goal === 'm' ? [0.45,0.65,0.8][wtr] : [0.55,0.75][wtr]; V = Math.max(peak8,vol4)*f; }
  else if (recovery) V = vol4*0.7;
  else if (fatigued) V = vol4*0.85;
  else V = Math.min(vol4*1.08, vol4+5);
  V = Math.max(12, Math.round(V));

  // Tempo-Texte
  const pt = paces ? {
    E: fmtPace(paces.E[0])+'–'+fmtPace(paces.E[1]), M: fmtPace(paces.M), HM: fmtPace(paces.HM), T: fmtPace(paces.T), I: fmtPace(paces.I)
  } : null;
  const b = hrBounds(P.lthr);
  const hrE = 'HF unter '+b[1], hrT = 'HF '+b[2]+'–'+b[3], hrM = 'HF '+b[0]+'–'+(b[2]-1), hrHM = 'HF '+b[2]+'–'+(b[3]+2);
  const tempo = (key, hr) => pt ? pt[key]+'/km · '+hr : hr;
  const Tp = paces ? paces.T : 330, Ip = paces ? paces.I : 300, HMp = paces ? paces.HM : 320;
  const km = x => Math.round(x*2)/2;

  // Qualitätseinheiten
  const Q = [];
  const light = recovery || fatigued;
  if (phase === 'Tapering' && wtr === 0){
    Q.push({title:'Aktivierung', detail:'3 km locker, dann 3×1 km im Wettkampftempo mit 2 min Trabpause, 2 km locker. 3–4 Tage vor dem Rennen.', tempo: tempo(goal==='m'?'M':'HM', goal==='m'?hrM:hrHM), km:8});
  } else if (light){
    Q.push({title:'Lockerer Lauf mit Steigerungen', detail:'Locker laufen, am Ende 6×20 s Steigerungen (zügig, nicht voll) mit voller Gehpause.', tempo: tempo('E', hrE), km:8});
  } else if (phase === 'Grundlage'){
    Q.push({title:'Lockerer Lauf mit Steigerungen', detail:'Locker laufen, am Ende 6–8×20 s Steigerungen.', tempo: tempo('E', hrE), km:9});
    if (nRuns >= 5) Q.push({title:'Fahrtspiel', detail:'2 km einlaufen, 8×1 min zügig im Schwellenbereich / 1 min locker, 2 km auslaufen.', tempo: tempo('T', hrT), km: km(4 + 16*60/((Tp+ (paces?paces.E[1]:360))/2))});
  } else if (phase === 'Aufbau'){
    Q.push({title:'Schwellenintervalle', detail:'2 km einlaufen, 3×10 min im Schwellentempo mit 2 min Trabpause, 2 km auslaufen.', tempo: tempo('T', hrT), km: km(4 + 1800/Tp + 0.6)});
    if (nRuns >= 5) Q.push({title:'Intervalle', detail:'2 km einlaufen, 5×1000 m im Intervalltempo mit 2:30 min Trabpause, 2 km auslaufen.', tempo: tempo('I', 'HF bis Z5'), km: 10.5});
  } else if (phase === 'Spezifisch'){
    if (goal === 'hm'){
      Q.push({title:'HM-Tempoblöcke', detail:'2 km einlaufen, 3×3 km im Halbmarathontempo mit 3 min Trabpause, 2 km auslaufen.', tempo: tempo('HM', hrHM), km: 14});
      if (nRuns >= 5) Q.push({title:'Tempodauerlauf', detail:'2 km einlaufen, 20–25 min im Schwellentempo am Stück, 2 km auslaufen.', tempo: tempo('T', hrT), km: km(4 + 1350/Tp)});
    } else {
      Q.push({title:'Schwellenblöcke', detail:'2 km einlaufen, 2×15 min im Schwellentempo mit 3 min Trabpause, 2 km auslaufen.', tempo: tempo('T', hrT), km: km(4 + 1800/Tp + 0.6)});
      if (nRuns >= 5) Q.push({title:'Marathontempo-Lauf', detail:'3 km einlaufen, 8–10 km im Marathontempo, 2 km auslaufen.', tempo: tempo('M', hrM), km: 14});
    }
  } else { // Tapering, nicht Rennwoche
    Q.push({title:'Tempo halten', detail:'2 km einlaufen, 4×1 km im Wettkampftempo mit 2 min Trabpause, 2 km auslaufen.', tempo: tempo(goal==='m'?'M':'HM', goal==='m'?hrM:hrHM), km: 9});
  }
  if (nRuns <= 3 && Q.length > 1) Q.length = 1;

  // langer Lauf
  const cap = Math.min(longest6 > 0 ? longest6 + 2 : 12, goal === 'm' ? 32 : 21);
  let L = km(Math.max(8, Math.min(V*(goal==='m'?0.3:0.28), cap)));
  if (phase === 'Tapering') L = km(Math.min(L, goal==='m' ? [0,18,26][wtr] || 14 : [0,14][wtr] || 12));
  let longDetail = 'Ruhig und gleichmäßig. Achte darauf, dass die HF in der zweiten Hälfte nicht davonläuft.';
  let longTempo = tempo('E', hrE);
  if (!light && phase === 'Spezifisch'){
    if (goal === 'hm') longDetail = 'Locker beginnen, die letzten 4 km im Halbmarathontempo.';
    else longDetail = 'Locker beginnen, im Mittelteil 3×4 km im Marathontempo mit je 1 km locker dazwischen.';
  }
  if (recovery) longDetail = 'Entlastungswoche: kürzer und bewusst locker.';

  // Wochenraster
  const layouts = {3:['Di:Q0','Do:E','So:L'], 4:['Di:Q0','Do:E','Sa:E','So:L'], 5:['Di:Q0','Mi:E','Do:Q1','Sa:E','So:L'], 6:['Mo:E','Di:Q0','Mi:E','Do:Q1','Sa:E','So:L']};
  const slots = layouts[nRuns].map(x => { const [d,t] = x.split(':'); return {day: WD.indexOf(d), t}; });
  slots.forEach(s => { if (s.t === 'Q1' && !Q[1]) s.t = 'E'; });
  const nEasy = slots.filter(s=>s.t==='E').length;
  const qKm = Q.reduce((s,q)=>s+q.km,0);
  const eKm = nEasy ? km(Math.min(16, Math.max(5, (V - L - qKm)/nEasy))) : 0;
  const sessions = [];
  for (let d=0; d<7; d++){
    const s = slots.find(x=>x.day===d);
    let item;
    if (!s) item = {day:d, type:'R', title:'Ruhetag', detail:'Frei oder lockeres Mobilisieren.', km:0};
    else if (s.t === 'L') item = {day:d, type:'L', title:'Langer Lauf', detail:longDetail, tempo:longTempo, km:L};
    else if (s.t === 'E') item = {day:d, type:'E', title:'Lockerer Lauf', detail:'Im Gesprächstempo. Lieber zu langsam als zu schnell.', tempo:tempo('E', hrE), km:eKm};
    else { const q = Q[+s.t[1]]; item = {day:d, type:'Q', ...q}; }
    sessions.push(item);
  }
  // Rennwoche: Rennen am Wettkampftag einsetzen
  if (phase === 'Tapering' && wtr === 0 && raceTs){
    const rd = (new Date(raceTs).getDay()+6)%7;
    sessions[rd] = {day:rd, type:'W', title: goal==='m' ? 'Marathon' : 'Halbmarathon', detail:'Wettkampf! Erste Kilometer bewusst kontrolliert.', tempo: tempo(goal==='m'?'M':'HM', goal==='m'?hrM:hrHM), km: goal==='m'?42.2:21.1};
    if (rd > 0 && sessions[rd-1].type !== 'R') sessions[rd-1] = {day:rd-1, type:'E', title:'Kurzer Lockerer', detail:'20–25 min ganz locker, 3 kurze Steigerungen.', tempo:tempo('E',hrE), km:4};
    if (rd < 6) for (let d=rd+1; d<7; d++) sessions[d] = {day:d, type:'R', title:'Erholung', detail:'Nach dem Rennen: Pause oder Spaziergang.', km:0};
    for (const s of sessions) if (s.type === 'L'){ s.type='E'; s.title='Lockerer Lauf'; s.km = Math.min(s.km, 8); s.detail='Kurz und locker.'; }
  }

  // Hinweise aus der Analyse
  const z = [0,0,0,0,0];
  for (const a of acts) if (today - a.start < 28*DAY && der[a.id]) der[a.id].zs.forEach((v,i)=> z[i]+=v);
  const zt = z.reduce((a,c)=>a+c,0);
  if (zt > 3600){
    const easy = (z[0]+z[1])/zt, grey = z[2]/zt;
    if (grey > 0.25) notes.push('In den letzten 4 Wochen lagen '+Math.round(grey*100)+' % deiner Zeit in Zone 3 („Grauzone“). Lockere Läufe lockerer, harte Einheiten gezielter – das bringt für '+(goal==='m'?'den Marathon':'den Halbmarathon')+' meist mehr.');
    else if (easy < 0.7) notes.push('Nur '+Math.round(easy*100)+' % deiner Trainingszeit war locker (Z1–Z2). Für Langdistanz sind etwa 75–80 % üblich.');
    else notes.push(Math.round(easy*100)+' % deiner Trainingszeit war locker (Z1–Z2) – gute Verteilung für die Langdistanz.');
  }
  if (fatigued) notes.push('Deine Ermüdung ist im Verhältnis zur Fitness hoch (Akut/Chronisch '+acwr.toFixed(2)+'). Diese Woche wird entlastet.');
  else if (acwr > 1.3) notes.push('Die Belastung steigt gerade schnell (Akut/Chronisch '+acwr.toFixed(2)+'). Nicht zusätzlich draufpacken.');
  if (recovery) notes.push('Entlastungswoche: etwa 30 % weniger Umfang, damit das Training der letzten Wochen wirken kann.');
  const decs = acts.filter(a => der[a.id] && der[a.id].dec !== null && today - a.start < 42*DAY && a.timer >= 3600).map(a => der[a.id].dec);
  if (decs.length){

function formState(){
  const c = state.series[state.series.length-1];
  if (!c || c.ctl < 5) return {label:'Zu wenig Daten', text:'Für eine Formkurve braucht es einige Wochen Training.'};
  const r = c.tsb / c.ctl;
  if (r < -0.3) return {label:'Hohe Ermüdung', text:'Mehr Belastung als dein Körper gerade verarbeitet. Erholung einplanen.'};
  if (r < -0.1) return {label:'Produktives Training', text:'Du setzt Reize, die Fitness wächst.'};
  if (r < 0.15) return {label:'Frisch', text:'Gute Voraussetzungen für eine harte Einheit oder einen Wettkampf.'};
  return {label:'Sehr frisch', text:'Viel Erholung. Dauert das länger an, sinkt die Fitness langsam.'};
}

async function applyWellness(recs, silentIfEmpty){

    const mx = xs.reduce((a,c)=>a+c,0)/n, my = ys.reduce((a,c)=>a+c,0)/n;
    const sl = xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0) / (xs.reduce((a,x)=>a+(x-mx)**2,0) || 1);
    const fit = xs.map(x => my + sl*(x-mx)), chg = (fit[n-1]-fit[0])/fit[0]*100;

  h += `</div>`;

  const z = [0,0,0,0,0]; for (const a of acts) if (now - a.start < 28*864e5 && der[a.id]) der[a.id].zs.forEach((v,i)=>z[i]+=v);
  const zt = z.reduce((a,c)=>a+c,0);

  const W = state.W;

    if (have.length >= 3){
      const f7 = have.slice(-7), f28 = rv.slice(-35, -7).filter(x=>x!=null);
      const a7 = f7.reduce((a,c)=>a+c,0)/f7.length, a28 = f28.length ? f28.reduce((a,c)=>a+c,0)/f28.length : null;
      h += `<h2>Ruhepuls (90 Tage)</h2><div class="panel"><div class="legend"><span><b style="background:var(--hr)"></b>Ruhepuls</span><span><b style="background:var(--muted)"></b>4-Wochen-Schnitt</span></div>
        ${lineSVG([{v:bv, c:'var(--muted)', w:1.3, dash:true},{v:rv, c:'var(--hr)', w:1.8}], {h:110, min:Math.min(...have)-3, max:Math.max(...have)+3, label:'Ruhepuls'})}
        <div class="axis"><span>vor 90 Tagen</span><span>heute</span></div>
        <p class="small" style="margin:8px 0 0">Letzte 7 Tage Ø <b>${num(a7,1)} bpm</b>${a28 !== null ? `, davor ${num(a28,1)} bpm. ${a7 < a28 - 1 ? 'Sinkender Ruhepuls ist meist ein Zeichen wachsender Fitness oder guter Erholung.' : a7 > a28 + 2 ? 'Der Ruhepuls steigt – Belastung, Schlaf und Stress im Blick behalten.' : 'Stabil.'}` : '.'}</p></div>`;
    }
    const sd = []; for (let i=29;i>=0;i--) sd.push(dayKey(now - i*864e5));
    const sls = sd.map(d => sleepOf(W, d)), tgt = (parseFloat(String(state.S.sleepTarget||'7.5').replace(',','.')) || 7.5);
    const valid = sls.filter(Boolean);
    if (valid.length >= 3){
      const avg = arr => arr.reduce((a,c)=>a+c,0)/arr.length;
      const l7 = sls.slice(-7).filter(Boolean), st = valid.filter(x => x.stages);
      h += `<h2>Schlaf (30 Nächte)</h2><div class="panel"><div class="legend"><span><b style="background:var(--accent)"></b>Schlafdauer</span><span><b style="background:var(--z3)"></b>Ziel ${num(tgt,1)} h</span></div>
        ${lineSVG([{v:sls.map(x => x ? x.tot/60 : null), c:'var(--accent)', bars:true, op:.75},{v:sd.map(()=>tgt), c:'var(--z3)', w:1.4, dash:true}], {h:110, min:0, max:Math.max(tgt+1, ...valid.map(x=>x.tot/60)), label:'Schlafdauer'})}
        <div class="axis"><span>vor 30 Tagen</span><span>letzte Nacht</span></div>
        <p class="small" style="margin:8px 0 0">Ø letzte 7 Nächte <b>${l7.length ? fmtHM(avg(l7.map(x=>x.tot))) : '–'}</b>, Ø 30 Nächte ${fmtHM(avg(valid.map(x=>x.tot)))}.${st.length ? ` Tiefschlaf im Schnitt ${num(avg(st.map(x=>x.deep/x.tot*100)))} %, REM ${num(avg(st.map(x=>x.rem/x.tot*100)))} %.` : ''}</p></div>`;
    }
  }

  const cadp = acts.filter(a => a.isRun && a.cad && now - a.start < 180*864e5).sort((a,b)=>a.start-b.start);
  if (cadp.length >= 3){
    h += `<h2>Schrittfrequenz</h2><div class="panel">${lineSVG([{v:cadp.map(a=>a.cad), c:'var(--z3)', dots:true}], {h:90, label:'Schrittfrequenz'})}
      <div class="axis"><span>${fmtDate(cadp[0].start)}</span><span>Ø ${num(cadp.reduce((s,a)=>s+a.cad,0)/cadp.length)} Schritte/min</span><span>${fmtDate(cadp[cadp.length-1].start)}</span></div></div>`;
  }
  const best = {};
  for (const a of acts) if (a.isRun && now - a.start < 365*864e5) for (const d in a.bestD) if (!best[d] || a.bestD[d] < best[d].t) best[d] = {t:a.bestD[d], a};
  const bk = Object.keys(best).sort((x,y)=>x-y);
  if (bk.length){
    h += `<h2>Bestzeiten (12 Monate)</h2><div class="list">${bk.map(d => `<button class="item" data-act="${esc(best[d].a.id)}"><div class="main"><div class="t1">${({1000:'1 km',5000:'5 km',10000:'10 km',21097.5:'Halbmarathon',42195:'Marathon'})[d]}</div><div class="t2">${fmtDate(best[d].a.start,true)} · ${fmtPace(best[d].t/(d/1000))}/km</div></div><div class="big">${fmtDur(best[d].t)}</div></button>`).join('')}</div>
      <p class="small muted" style="margin-top:6px">Schnellster Abschnitt innerhalb eines Laufs, aus GPS-Daten – kann leicht abweichen.</p>`;
  }
  return h;
}

/* ---------- Detailansicht ---------- */
function openAct(id){
  const a = state.acts.find(x => x.id === id); if (!a) return;
  const d = state.der[id], st = a.stream, b = hrBounds(state.P.lthr);
  const every = Math.max(1, Math.ceil(st.t.length / 400));
  const idx = st.t.map((_,i)=>i).filter(i => i % every === 0);
  const sm = i => { let s=0,n=0; for (let k=Math.max(0,i-6); k<=Math.min(st.v.length-1,i+6); k++){ if (st.v[k] > 0){ s+=st.v[k]; n++; } } return n ? s/n : 0; };
  const hr = idx.map(i => st.hr[i] > 0 ? st.hr[i] : null);
  const pace = idx.map(i => { const v = sm(i); return v > 1.3 ? 1000/v : null; });
  const hasHR = hr.some(x=>x), hasPace = a.isRun && pace.some(x=>x);
  const pv = pace.filter(x=>x).sort((x,y)=>x-y);
  let h = `<div class="bar"><h2>${esc(a.name)}</h2><button class="icon-btn" data-action="close" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="wrap">
    <p class="muted" style="margin-top:0">${fmtDate(a.start,true)}, ${new Date(a.start).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} Uhr</p>
    <div class="stats">
      <div><div class="v">${fmtKm(a.dist,2)}</div><div class="l">km</div></div>
      <div><div class="v">${fmtDur(a.timer)}</div><div class="l">Zeit</div></div>
      <div><div class="v">${a.isRun && a.avgSpd ? fmtPace(1000/a.avgSpd) : '–'}</div><div class="l">Ø Pace /km</div></div>
      <div><div class="v">${a.avgHR || '–'}</div><div class="l">Ø HF</div></div>
      <div><div class="v">${a.maxHR || '–'}</div><div class="l">max. HF</div></div>
      <div><div class="v">${num(d.trimp)}</div><div class="l">Belastung${d.hrEst?' (geschätzt)':''}</div></div>
    </div>`;
  if (hasHR) h += `<h3>Herzfrequenz</h3><div class="panel">${lineSVG([{v:hr, c:'var(--hr)', w:1.6}], {h:120, min: Math.max(60, Math.min(...hr.filter(x=>x)) - 5), max: Math.max(...hr.filter(x=>x)) + 3, bands: [0,1,2,3,4].map(i => ({from: i ? b[i-1] : 0, to: i < 4 ? b[i] : 250, c: ZC[i]})), label:'Herzfrequenzverlauf'})}<div class="axis"><span>0:00</span><span>${fmtDur(st.t[st.t.length-1]||0)}</span></div></div>`;
  if (hasPace) h += `<h3>Pace</h3><div class="panel">${lineSVG([{v:pace, c:'var(--pace)', w:1.6}], {h:110, invert:true, min: pv[Math.floor(pv.length*0.02)] - 10, max: pv[Math.floor(pv.length*0.98)] + 15, label:'Paceverlauf'})}<div class="axis"><span>schneller oben</span><span>${fmtPace(pv[Math.floor(pv.length*0.02)])} – ${fmtPace(pv[Math.floor(pv.length*0.98)])} /km</span></div></div>`;
  const zt = d.zs.reduce((x,y)=>x+y,0);
  if (zt) h += `<h3>Zeit in Zonen</h3><div class="panel">${d.zs.map((v,i) => `<div style="display:flex;align-items:center;gap:10px;padding:3px 0;font-size:14.5px"><span style="width:28px;font-weight:600">Z${i+1}</span><span style="flex:1;height:10px;background:var(--bg);border-radius:4px;overflow:hidden"><span style="display:block;height:100%;width:${v/zt*100}%;background:${ZC[i]}"></span></span><span style="width:74px;text-align:right">${fmtDur(v)}</span></div>`).join('')}</div>`;
  const rows = [];
  if (d.dec !== null) rows.push(['Aerobe Entkopplung', num(d.dec,1)+' %', d.dec < 5 ? 'Unter 5 %: Puls bleibt stabil, gute Ausdauer für dieses Tempo.' : 'Über 5 %: Der Puls driftet in der zweiten Hälfte nach oben.']);
  if (d.ef) rows.push(['Effizienzfaktor', num(d.ef,2), 'Meter pro Minute je Herzschlag – im Verlauf vergleichen.']);
  if (a.te != null) rows.push(['Training Effect (Garmin)', num(a.te,1)+(a.ane != null ? ' / '+num(a.ane,1)+' anaerob' : ''), '']);
  if (a.cad) rows.push(['Schrittfrequenz', a.cad+' /min', '']);
  if (a.gct) rows.push(['Bodenkontaktzeit', a.gct+' ms', '']);
  if (a.vo) rows.push(['Vertikale Bewegung', num(a.vo,1)+' cm', '']);
  if (a.ascent != null) rows.push(['Anstieg', a.ascent+' m', '']);
  if (a.kcal != null) rows.push(['Kalorien', a.kcal+' kcal', '']);
  if (rows.length) h += `<h3>Kennzahlen</h3><div class="list">${rows.map(r => `<div class="item"><div class="main"><div class="t1">${r[0]}</div>${r[2] ? `<div class="t2">${r[2]}</div>` : ''}</div><div class="big" style="font-size:20px">${r[1]}</div></div>`).join('')}</div>`;
  const bd = Object.keys(a.bestD).sort((x,y)=>x-y);
  if (bd.length) h += `<h3>Schnellste Abschnitte</h3><div class="list">${bd.map(k => `<div class="item"><div class="main"><div class="t1">${({1000:'1 km',5000:'5 km',10000:'10 km',21097.5:'Halbmarathon',42195:'Marathon'})[k]}</div></div><div class="big" style="font-size:20px">${fmtDur(a.bestD[k])}</div></div>`).join('')}</div>`;
  h += `<p style="margin-top:22px"><button class="btn danger" data-action="delact" data-id="${esc(a.id)}">Aktivität löschen</button></p></div>`;
  openSheet(h);
}

/* ---------- Einstellungen ---------- */
function openSettings(){
  const S = state.S, P = state.P;
  const seg = (name, opts) => `<div class="seg" data-seg="${name}">${opts.map(o => `<button type="button" data-val="${o[0]}" aria-pressed="${String(S[name]) === String(o[0])}">${o[1]}</button>`).join('')}</div>`;
  const h = `<div class="bar"><h2>Einstellungen</h2><button class="icon-btn" data-action="close" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="wrap form">
    <h2 style="margin-top:4px">Ziel</h2>
    <label>Distanz</label>${seg('goal', [['hm','Halbmarathon'],['m','Marathon']])}
    <div class="two"><div><label for="raceDate">Wettkampfdatum</label><input type="date" id="raceDate" value="${esc(S.raceDate||'')}"></div>
    <div><label for="targetTime">Zielzeit</label><input id="targetTime" inputmode="numeric" placeholder="${S.goal==='hm'?'1:45:00':'3:45:00'}" value="${esc(S.targetTime||'')}"></div></div>
    <label>Läufe pro Woche</label>${seg('runsPerWeek', [[3,'3'],[4,'4'],[5,'5'],[6,'6']])}

    <h2>Körperwerte</h2>
    <p class="small muted">Leer lassen = automatisch aus deinen Daten geschätzt (grau angezeigt).</p>
    <div class="two">
      <div><label for="maxHR">HFmax (bpm)</label><input id="maxHR" type="number" inputmode="numeric" placeholder="${P.maxHR}" value="${esc(S.maxHR||'')}"></div>
      <div><label for="restHR">Ruhepuls (bpm)</label><input id="restHR" type="number" inputmode="numeric" placeholder="${P.restHR}" value="${esc(S.restHR||'')}"></div>
    </div>
    <label for="lthr">Laktatschwellen-Puls (bpm)</label><input id="lthr" type="number" inputmode="numeric" placeholder="${P.lthr}" value="${esc(S.lthr||'')}">
    <div class="hint">Aktuell: ${esc(P.src.lthr)}. Wichtigster Wert für deine Zonen.</div>
    <div class="two">
      <div><label>Geschlecht</label>${seg('sex', [['m','männlich'],['f','weiblich']])}</div>
      <div><label for="age">Alter</label><input id="age" type="number" inputmode="numeric" value="${esc(S.age||'')}"></div>
    </div>
    <div class="hint">Geschlecht beeinflusst nur die TRIMP-Belastungsformel.</div>
    <label for="sleepTarget">Schlafziel (Stunden)</label><input id="sleepTarget" inputmode="decimal" placeholder="7,5" value="${esc(S.sleepTarget||'')}">
    <div class="hint">Grundlage für die Schlafbewertung in der Erholung.</div>

    <h2>Letztes Wettkampfergebnis</h2>
    <p class="small muted">Optional, macht Tempobereiche und Prognosen deutlich genauer. Nimm ein Rennen der letzten 2–3 Monate.</p>
    <div class="two">
      <div><label for="raceDist">Distanz</label><select id="raceDist">${[['','– keins –'],['5','5 km'],['10','10 km'],['21.0975','Halbmarathon'],['42.195','Marathon']].map(o => `<option value="${o[0]}" ${String(S.raceDist||'')===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
      <div><label for="raceTime">Zeit</label><input id="raceTime" inputmode="numeric" placeholder="z. B. 45:30" value="${esc(S.raceTime||'')}"></div>
    </div>
    <p style="margin-top:20px"><button class="btn" data-action="save">Speichern</button></p>

    <h2>Daten</h2>
    <p class="small">${state.acts.length} Aktivitäten gespeichert. Die Original-FIT-Dateien bleiben in Garmin Connect, du kannst sie jederzeit neu importieren.</p>
    <p class="small">Tageswerte: ${Object.keys(state.W.rhr).length} Tage Ruhepuls, ${Object.keys(state.W.sleep).length} Nächte Schlaf.</p>
    <p style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn danger" data-action="clearall">Alle Aktivitäten löschen</button><button class="btn danger" data-action="clearwell">Tageswerte löschen</button></p>
    ${privacyNote()}
  </div>`;
  openSheet(h);
}
async function saveSettings(){
  const g = id => $('#'+id).value.trim();
  const S = state.S;
  S.raceDate = g('raceDate'); S.targetTime = g('targetTime');
  S.maxHR = g('maxHR'); S.restHR = g('restHR'); S.lthr = g('lthr'); S.age = g('age');
  S.raceDist = g('raceDist'); S.raceTime = g('raceTime'); S.sleepTarget = g('sleepTarget');
  if (S.targetTime && !parseDuration(S.targetTime)) return toast('Zielzeit bitte als h:mm:ss eingeben, z. B. 3:45:00');
  if (S.raceTime && !parseDuration(S.raceTime)) return toast('Wettkampfzeit bitte als mm:ss oder h:mm:ss eingeben');
  await DB.setMeta('settings', JSON.parse(JSON.stringify(S)));
  recompute(); closeSheet(); render(); toast('Gespeichert');
}

/* ---------- Import ---------- */
async function importFiles(files){
  const existing = new Set(state.acts.map(a => a.id));
  let added = 0, dup = 0, other = 0, failed = 0, seen = 0;
  const hk = [];
  let hkSeen = false;
  toast('Lese Dateien …', true);
  const lineSink = () => { let carry = ''; return { push(c){ const ls = (carry + c).split('\n'); carry = ls.pop(); for (const l of ls) parseHealthXmlLine(l, hk); }, end(){ if (carry) parseHealthXmlLine(carry, hk); } }; };
  async function healthFromEntry(e){
    hkSeen = true; const sink = lineSink(); let lastP = -5;
    await new Promise((res, rej) => {
      e.internalStream('string').on('data', (c, meta) => { sink.push(c); if (meta && meta.percent - lastP >= 2){ lastP = meta.percent; toast('Apple-Health-Export wird gelesen … '+Math.round(meta.percent)+' %', true); } })
        .on('error', rej).on('end', () => { sink.end(); res(); }).resume();
    });
  }
  async function healthFromFile(f){
    hkSeen = true; const sink = lineSink(), rd = f.stream().pipeThrough(new TextDecoderStream()).getReader(); let n = 0;
    for (;;){ const {done, value} = await rd.read(); if (done) break; sink.push(value); n += value.length; if (n > 2e7){ n = 0; toast('Apple-Health-Export wird gelesen …', true); } }
    sink.end();
  }
  async function handle(buf){
    const u = new Uint8Array(buf, 0, Math.min(4, buf.byteLength));
    if (u[0] === 0x50 && u[1] === 0x4B){
      if (!window.JSZip) throw new Error('zip');
      const z = await JSZip.loadAsync(buf);
      const entries = Object.values(z.files).filter(f => !f.dir && /\.(fit|zip)$/i.test(f.name) && !/(^|\/)(__MACOSX|\._)/.test(f.name));
      const hx = Object.values(z.files).find(f => !f.dir && /(^|\/)(export|Export)\.xml$/.test(f.name));
      if (hx) await healthFromEntry(hx);
      for (const e of entries){ try { await handle(await e.async('arraybuffer')); } catch(err){ if (err.message === 'zip') throw err; failed++; } }
      return;
    }
    const head = new TextDecoder().decode(new Uint8Array(buf, 0, Math.min(8, buf.byteLength)));
    if (/^\s*(LB1|R;|S;)/.test(head)){ hkSeen = true; hk.push(...parseShortcutText(new TextDecoder().decode(buf))); return; }
    seen++;
    if (seen % 15 === 0){ toast(`Lese Dateien … ${seen} verarbeitet`, true); await new Promise(r => setTimeout(r, 0)); }
    const a = buildActivity(parseFit(buf));
    if (!a){ other++; return; }
    if (existing.has(a.id)){ dup++; return; }
    existing.add(a.id); await DB.put(a); state.acts.push(a); added++;
  }
  for (const f of files){
    try { if (/\.xml$/i.test(f.name)) await healthFromFile(f); else await handle(await f.arrayBuffer()); }
    catch(e){ if (e.message === 'zip'){ toast('ZIP-Dateien können gerade nicht gelesen werden. Entpacke die ZIP in der Dateien-App (antippen) und importiere die .fit-Datei.'); return; } failed++; }
  }
  let wr = null;
  if (hk.length){ wr = ingestWellness(state.W, hk); await DB.setMeta('wellness', state.W); }
  recompute(); render();
  const parts = [];
  if (added || dup || !hkSeen) parts.push(`${added} Aktivitäten neu importiert`);
  if (hkSeen) parts.push(wr && (wr.rhr || wr.nights) ? `Tageswerte: ${wr.rhr} Ruhepuls-Werte, ${wr.nights} Nächte` : 'keine Ruhepuls- oder Schlafdaten im Export gefunden');
  if (dup) parts.push(`${dup} schon vorhanden`);
  if (failed) parts.push(`${failed} nicht lesbar`);
  if (added === 0 && !dup && other && !hkSeen) parts.push('keine Aktivitäten gefunden');
  toast(parts.join(', '));
}

/* ---------- Grundgerüst ---------- */
function render(){
  const v = $('#view');
  if (!state.acts.length && state.tab !== 'laeufe') v.innerHTML = emptyView();
  else v.innerHTML = ({heute:viewHeute, laeufe:viewLaeufe, plan:viewPlan, zonen:viewZonen, trends:viewTrends})[state.tab]();
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === state.tab ? 'page' : 'false'));
}
function openSheet(html){ const s = $('#sheet'); s.innerHTML = html; s.classList.add('open'); s.scrollTop = 0; document.body.style.overflow = 'hidden'; }
function closeSheet(){ const s = $('#sheet'); s.classList.remove('open'); s.innerHTML = ''; document.body.style.overflow = ''; }
let tt;
function toast(msg, sticky){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); if (!sticky) tt = setTimeout(() => t.classList.remove('show'), 4200); }

document.addEventListener('click', async e => {
  const tab = e.target.closest('#tabs button');
  if (tab){ state.tab = tab.dataset.tab; render(); window.scrollTo(0,0); return; }
  const act = e.target.closest('[data-act]'); if (act){ openAct(act.dataset.act); return; }
  const segb = e.target.closest('[data-seg] button');
  if (segb){ const name = segb.parentNode.dataset.seg; let v = segb.dataset.val; if (name === 'runsPerWeek') v = +v; state.S[name] = v;
    segb.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === segb)); return; }
  const a = e.target.closest('[data-action]'); if (!a) return;
  const k = a.dataset.action;
  if (k === 'import') $('#fileIn').click();
  else if (k === 'close') closeSheet();
  else if (k === 'settings') openSettings();
  else if (k === 'wellness') openWellness();
  else if (k === 'wapply'){ const t = $('#wtext').value; if (!t.trim()) return toast('Das Feld ist leer. Erst den Kurzbefehl ausführen, dann einfügen.'); const r = await applyWellness(parseShortcutText(t)); if (r.rhr || r.nights){ closeSheet(); toast(`Übernommen: ${r.rhr} Ruhepuls-Werte, ${r.nights} Nächte`); } }
  else if (k === 'wclip'){ try { const t = await navigator.clipboard.readText(); $('#wtext').value = t; if (t.trim()){ const r = await applyWellness(parseShortcutText(t)); if (r.rhr || r.nights){ closeSheet(); toast(`Übernommen: ${r.rhr} Ruhepuls-Werte, ${r.nights} Nächte`); } } else toast('Die Zwischenablage ist leer.'); } catch(err){ toast('Kein Zugriff auf die Zwischenablage. Tippe lange ins Feld und wähle „Einfügen“.'); } }
  else if (k === 'clearwell'){ if (!confirm('Alle Ruhepuls- und Schlafdaten löschen?')) return; state.W = newWellness(); await DB.setMeta('wellness', state.W); recompute(); closeSheet(); render(); toast('Tageswerte gelöscht'); }
  else if (k === 'save') saveSettings();
  else if (k === 'showall'){ state.showAll = true; render(); }
  else if (k === 'delact'){ if (!confirm('Diese Aktivität löschen?')) return; await DB.del(a.dataset.id); state.acts = state.acts.filter(x => x.id !== a.dataset.id); recompute(); closeSheet(); render(); toast('Aktivität gelöscht'); }
  else if (k === 'clearall'){ if (!confirm('Wirklich alle importierten Aktivitäten löschen? Einstellungen bleiben erhalten.')) return; await DB.clear(); state.acts = []; recompute(); closeSheet(); render(); toast('Alle Aktivitäten gelöscht'); }
});
$('#importBtn').addEventListener('click', () => $('#fileIn').click());
$('#settingsBtn').addEventListener('click', openSettings);
$('#fileIn').addEventListener('change', e => { const f = [...e.target.files]; e.target.value = ''; if (f.length) importFiles(f); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

(async function init(){
  await DB.open();
  const s = await DB.getMeta('settings'); if (s) Object.assign(state.S, s);
  const w = await DB.getMeta('wellness'); if (w && w.rhr && w.sleep) state.W = w;
  state.acts = (await DB.all()) || [];
  recompute(); render();
})();
})();
</script>
